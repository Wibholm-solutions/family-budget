services:
  family-budget:
    build: .
    container_name: family-budget
    restart: unless-stopped
    ports:
      - "8086:8086"
    labels:
      - "dashboard.healthcheck.url=http://localhost:8086/budget/health"
    volumes:
      # Persist database outside container
      - ./data:/app/data
    environment:
      - TZ=Europe/Copenhagen
      - PYTHONUNBUFFERED=1
      # Production disables /docs, /redoc and /openapi.json
      - ENVIRONMENT=${ENVIRONMENT:-production}
      # Reverse proxies whose X-Forwarded-For may be trusted (Caddy on the
      # Docker host reaches the container via the bridge gateway)
      - TRUSTED_PROXY_IPS=${TRUSTED_PROXY_IPS:-127.0.0.1,::1,172.17.0.1}
      - APP_VERSION=${APP_VERSION}
      # Feedback API (replaces direct GitHub API calls)
      - FEEDBACK_API_URL=${FEEDBACK_API_URL:-http://172.17.0.1:3102}
      - GITHUB_REPO=${GITHUB_REPO:-Wibholm-solutions/family-budget}
      # SMTP via host Postfix relay
      - SMTP_HOST=172.17.0.1
      - SMTP_PORT=25
      - SMTP_FROM=noreply@wibholmsolutions.com
      # Stripe donation links
      - STRIPE_DONATE_10=${STRIPE_DONATE_10}
      - STRIPE_DONATE_25=${STRIPE_DONATE_25}
      - STRIPE_DONATE_50=${STRIPE_DONATE_50}
