name: CI

# Runs on the trusted development-PC CI lane only. Every job requests the exact
# lane labels, and the pull-request guard keeps fork code off the runner.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: server-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, server, ci]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run unit, integration and Playwright E2E suites
        shell: bash
        env:
          # The lane's only intentional non-secret cache. Browser downloads and
          # wheels live here so a job does not re-download them every run.
          LANE_CACHE: /home/ci/.cache/ci
        run: |
          set -euo pipefail
          mkdir -p "$LANE_CACHE/pip" "$LANE_CACHE/ms-playwright"
          # The lane host has no passwordless sudo and no browser system
          # libraries, so Playwright runs inside a container instead.
          docker run --rm \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            --volume "$LANE_CACHE/pip:/root/.cache/pip" \
            --volume "$LANE_CACHE/ms-playwright:/ms-playwright" \
            --env PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            --env PYTHONDONTWRITEBYTECODE=1 \
            python:3.12-slim bash -c '
              set -euo pipefail
              pip install --quiet --root-user-action=ignore --requirement requirements.txt
              playwright install --with-deps chromium >/dev/null
              python -m pytest tests/
              python -m pytest e2e/
            '

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: [self-hosted, linux, x64, server, ci]
    permissions:
      contents: read
      packages: write
    outputs:
      # The digest is the image's identity, and the promotion request names it.
      # Nothing downstream may refer to a tag: a tag can be moved, and a movable
      # reference must never be able to authorise a deployment.
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Enforce zero-spend gate
        shell: bash
        run: /usr/local/lib/homelab-ci/assert-zero-spend-gate.sh

      - name: Build and publish a digest-identified image with open attestations
        id: publish
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY,,}"
          # Provenance tag only. The digest is the identity, and no `latest` or
          # semantic alias is published, so no alias can authorise a deployment.
          image="ghcr.io/${repository}:sha-${GITHUB_SHA}"
          export DOCKER_CONFIG="$(mktemp -d /dev/shm/family-budget-docker.XXXXXX)"
          chmod 0700 "$DOCKER_CONFIG"
          cleanup_registry_auth() {
            docker logout ghcr.io >/dev/null 2>&1 || true
            rm -rf -- "$DOCKER_CONFIG"
          }
          trap cleanup_registry_auth EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx build \
            --file Dockerfile \
            --tag "$image" \
            --sbom=true \
            --provenance=mode=max \
            --push \
            .
          digest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          sbom_json="$(docker buildx imagetools inspect "$image" --format '{{json .SBOM.SPDX}}')"
          if ! printf '%s\n' "$sbom_json" | jq -e '.SPDXID | type == "string" and length > 0' >/dev/null; then
            echo 'published image is missing an SPDX SBOM' >&2
            exit 1
          fi
          echo 'verified-sbom-spdx'
          provenance_json="$(docker buildx imagetools inspect "$image" --format '{{json .Provenance.SLSA}}')"
          if ! printf '%s\n' "$provenance_json" | jq -e \
            '(.buildType // .buildDefinition.buildType // .predicate.buildType) | type == "string" and length > 0' >/dev/null; then
            echo 'published image is missing SLSA provenance' >&2
            exit 1
          fi
          echo 'verified-slsa-provenance'
          if ! printf '%s\n' "$provenance_json" | jq -e \
            --arg source_commit "$GITHUB_SHA" \
            --arg source_repository "$repository" \
            'tostring | ascii_downcase | contains($source_commit) and contains($source_repository)' >/dev/null; then
            echo 'SLSA provenance is not bound to the source repository and commit' >&2
            exit 1
          fi
          echo 'verified-slsa-provenance-source'
          echo "published ghcr.io/${repository}@${digest}"
          # The promotion request is only as trustworthy as this string, so it is
          # checked here rather than at the receiver, which would reject it anyway.
          if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "published digest is not an immutable sha256 identity: $digest" >&2
            exit 1
          fi
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### Published image"
            echo
            echo "- digest: \`ghcr.io/${repository}@${digest}\`"
            echo "- provenance tag: \`sha-${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # The other end of the lane. Until this job existed, a merge to master published a
  # digest that nothing consumed: shipping meant hand-editing desired-state.json in
  # saabendtsen/home-server. This job asks for the promotion; it decides nothing.
  #
  # It never touches the server and holds no deployment credential of its own. It
  # sends one repository_dispatch to the infrastructure repository, whose receiver
  # re-validates every field from scratch against the checked-in lane contract and
  # then deploys, verifies and records, rolling back to the known-good digest if the
  # verification contract fails. A request this job could forge is refused there.
  promote:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, linux, x64, server, ci]
    permissions:
      contents: read
    env:
      APPLICATION: family-budget
    steps:
      - name: Mint a short-lived cross-repository token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: saabendtsen
          repositories: home-server
          permission-contents: write

      - name: Send the promotion request
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          # The request is nested under a single `request` property because a
          # repository_dispatch client_payload may carry at most 10 top-level
          # properties, and a promotion request has 11 required fields. Sent flat,
          # the API rejects it before the receiver ever sees it.
          jq -n \
            --arg request_id "promotion-$(date -u +%Y-%m-%d)-$(printf '%04d' "$GITHUB_RUN_NUMBER")" \
            --arg application "${APPLICATION}" \
            --arg source_repository "${GITHUB_REPOSITORY}" \
            --arg image "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${APPLICATION}" \
            --arg digest "${DIGEST}" \
            --arg source_commit "${GITHUB_SHA}" \
            --arg run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg requested_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
               event_type: "promotion-request",
               client_payload: {
                 request: {
                   schema_version: 1,
                   request_id: $request_id,
                   application: $application,
                   host: "homelab",
                   source_repository: $source_repository,
                   image: $image,
                   digest: $digest,
                   source_commit: $source_commit,
                   source_workflow_run: $run,
                   runtime_contract_version: "1.0.0",
                   requested_at: $requested_at
                 }
               }
             }' \
            | gh api repos/saabendtsen/home-server/dispatches --input -
          {
            echo "### Promotion requested"
            echo
            echo "- digest: \`${DIGEST}\`"
            echo "- receiver: https://github.com/saabendtsen/home-server/actions/workflows/promotion.yml"
          } >> "$GITHUB_STEP_SUMMARY"
